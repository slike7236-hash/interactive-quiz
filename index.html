<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* Video fon uchun konteyner */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: #000; /* Video yuklanguncha qora fon */
    }

    /* iframe elementini ekran bo'ylab 16:9 nisbatda cho'shish */
    .video-background iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* 16:9 nisbat saqlanadi */
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
    }

    /* Video ustida ko'rinadigan asosiy matn va kontent */
    .content {
      position: relative;
      z-index: 1;
      color: #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3); /* Matn yaxshiroq ko'rinishi uchun biroz xiralashtirish */
    }

    .content h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .content p {
      font-size: 1.2rem;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- YouTube video orqa fon bloki -->
  <div class="video-background">
    <iframe 
      src="https://www.youtube.com/embed/w48f5KjGQqg?autoplay=1&mute=1&loop=1&playlist=w48f5KjGQqg&controls=0&showinfo=0&rel=0&enablejsapi=1" 
      title="YouTube video player" 
      frameborder="0" 
      allow="autoplay; encrypted-media" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Ekranda ko'rinadigan asosiy kontent -->
  <div class="content">
    <h1>Sizning Matningiz</h1>
    <p>Orqa fonda YouTube video uzluksiz ijro etilmoqda.</p>
  </div>

</body>
</html>
