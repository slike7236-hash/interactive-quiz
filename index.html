<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiv Jamoaviy O'yin</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js 3D kutubxonasi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D Akvarium Fon Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <!-- 1. Jamoalarni Sozlash Ekrani -->
    <div id="setup-screen" class="card">
      <h1>🎮 Jamoaviy Activity O'yini</h1>
      <p class="subtitle">Jamoalarni sozlang va o'yinni boshlang</p>

      <div class="teams-setup-grid">
        <div class="team-setup-card">
          <h3>1-Jamoa</h3>
          <input type="text" class="team-name-input" value="1-Jamoa">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>

        <div class="team-setup-card">
          <h3>2-Jamoa</h3>
          <input type="text" class="team-name-input" value="2-Jamoa">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>

        <div class="team-setup-card">
          <h3>3-Jamoa</h3>
          <input type="text" class="team-name-input" value="3-Jamoa">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>
      </div>

      <button id="start-game-btn" class="main-btn">O'yinni Boshlash 🚀</button>
    </div>

    <!-- 2. Asosiy O'yin Maydoni -->
    <div id="game-screen" class="hidden">
      <div id="scoreboard" class="scoreboard"></div>
      <div id="quiz-board" class="quiz-board"></div>
    </div>

    <!-- 3. Savol Modali -->
    <div id="question-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-modal" class="close-btn">&times;</span>
        <div id="modal-category" class="modal-category">Mavzu</div>
        <div id="modal-question" class="modal-question">Savol matni</div>
        
        <button id="show-answer-btn" class="sub-btn">Javobni Ko'rsatish</button>
        <div id="modal-answer" class="modal-answer hidden">Javob matni</div>

        <div class="award-buttons">
          <p>Ballni qaysi jamoaga beramiz?</p>
          <div id="team-award-list" class="team-award-list"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
