<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamoaviy Activity O'yini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 1-BOSQICH: Jamoalarni sozlash ekrani -->
    <div id="setup-screen">
      <h1>Jamoaviy Activity O'yini</h1>
      <p class="subtitle">Jamoalarni sozlang va o'yinni boshlang</p>

      <div class="teams-grid">
        <div class="team-card">
          <h3>1-Jamoa</h3>
          <input type="text" class="team-name" value="1-Jamoa" placeholder="Jamoa nomi">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>

        <div class="team-card">
          <h3>2-Jamoa</h3>
          <input type="text" class="team-name" value="2-Jamoa" placeholder="Jamoa nomi">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>

        <div class="team-card">
          <h3>3-Jamoa</h3>
          <input type="text" class="team-name" value="3-Jamoa" placeholder="Jamoa nomi">
          <p class="label">Ikonka tanlang:</p>
          <div class="icon-selector"></div>
        </div>
      </div>

      <button id="start-btn">O'yinni Boshlash 🚀</button>
    </div>

    <!-- 2-BOSQICH: O'yin maydoni -->
    <div id="game-screen" class="hidden">
      <h1>O'yin Maydoni</h1>
      
      <!-- Jamoalar Ochkolari -->
      <div id="scoreboard" class="scoreboard"></div>

      <!-- Savol paneli -->
      <div class="question-card">
        <h2 id="current-turn">Navbat: -</h2>
        <div id="question-box" class="question-box">
          <p id="question-text">Savol yuklanmoqda...</p>
        </div>
        <div class="action-buttons">
          <button id="correct-btn" class="btn-success">+10 Ball (To'g'ri)</button>
          <button id="wrong-btn" class="btn-danger">O'tkazib yuborish</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
