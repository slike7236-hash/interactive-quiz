<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamoaviy Activity O'yini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Jamoaviy Activity O'yini</h1>
    <p class="subtitle">Jamoalarni sozlang va o'yinni boshlang</p>

    <div class="teams-grid">
      <!-- 1-Jamoa -->
      <div class="team-card">
        <h3>1-Jamoa</h3>
        <input type="text" class="team-name" value="tom" placeholder="Jamoa nomi">
        <p class="label">Ikonka tanlang:</p>
        <div class="icon-selector"></div>
      </div>

      <!-- 2-Jamoa -->
      <div class="team-card">
        <h3>2-Jamoa</h3>
        <input type="text" class="team-name" value="jim" placeholder="Jamoa nomi">
        <p class="label">Ikonka tanlang:</p>
        <div class="icon-selector"></div>
      </div>

      <!-- 3-Jamoa -->
      <div class="team-card">
        <h3>3-Jamoa</h3>
        <input type="text" class="team-name" value="ron" placeholder="Jamoa nomi">
        <p class="label">Ikonka tanlang:</p>
        <div class="icon-selector"></div>
      </div>
    </div>

    <button id="start-btn">O'yinni Boshlash 🚀</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
